[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bastiontrace"
version = "0.1.0"
description = "Forensics for injected AI agents: read a tool-call trace, locate the prompt injection, and map its blast radius. Investigate side of the bastion trilogy (agentbastion + bastionprobe)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stefano Rizzello", email = "rizzellostefano@gmail.com" }]
keywords = ["llm", "security", "prompt-injection", "ai-agent", "forensics", "incident-response", "agent-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
bastiontrace = "bastiontrace.cli:main"

[project.urls]
Homepage = "https://github.com/Rinkia/bastiontrace"
Repository = "https://github.com/Rinkia/bastiontrace"
Issues = "https://github.com/Rinkia/bastiontrace/issues"

[tool.setuptools]
packages = ["bastiontrace"]
